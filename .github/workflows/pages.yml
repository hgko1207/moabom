# One workflow for every deploy (SPEC §11, eng review D3):
# - push to main: test -> build -> deploy
# - weekly schedule / manual run: fetch fresh data first (YouTube API 30-day rule), commit it, then the same
#   test -> build -> deploy. Pushes made with GITHUB_TOKEN do not trigger workflows, so deploying happens here.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 1' # Monday 18:00 UTC = Tuesday 03:00 KST
  workflow_dispatch:
    inputs:
      force:
        description: 'Allow groups to shrink by more than half (fetch --force)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch videos
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run fetch -- --all ${{ inputs.force && '--force' || '' }}

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/collections
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m "Refresh video data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - run: npm test
      - run: npm run build # tsc && vite build

      - name: Make sure the API key is not in the build
        run: |
          if grep -rq 'AIza' dist; then echo 'API key found in dist'; exit 1; fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
