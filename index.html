<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover (2026-10-21): with it, iPhone landscape shifted the YouTube picture right by the
         safe-area inset (59px) and cut its right edge, in both the normal and the big view. Safari now keeps the
         page out of the notch / Dynamic Island area itself; the env() paddings simply resolve to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F5EC" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="모아봄" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>모아봄</title>
    <!-- Link previews (KakaoTalk, Instagram, Naver, Band). Absolute URLs on the promo domain fixed in SPEC §1.
         KakaoTalk keeps a preview per URL for a long time: after changing these, clear it in the Kakao share debugger. -->
    <meta name="description" content="공식 채널 영상만, 순서대로. 고를 필요 없어요" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="모아봄" />
    <meta property="og:title" content="모아봄" />
    <meta property="og:description" content="공식 채널 영상만, 순서대로. 고를 필요 없어요" />
    <meta property="og:url" content="https://moabom.hgko.dev/" />
    <meta property="og:image" content="https://moabom.hgko.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="모아봄 로고와 한 줄 소개" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="모아봄" />
    <meta name="twitter:description" content="공식 채널 영상만, 순서대로. 고를 필요 없어요" />
    <meta name="twitter:image" content="https://moabom.hgko.dev/og.png" />
    <style>
      /* In-app browser escape bar (design DR27): in the page flow above the app, no close button. Quiet page
         colours (the app's --line and --ink), not navy: dark is kept for the bedtime screen (critique 2026-10-20). */
      .escape-bar {
        position: relative;
        padding: max(16px, env(safe-area-inset-top)) max(64px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left));
        background: #e6ecdd;
        border-bottom: 1px solid #dfe6d6;
        color: #18221e;
        font: 16px/1.5 'Pretendard Variable', Pretendard, sans-serif;
        word-break: keep-all;
      }
      .escape-bar p {
        margin: 0 0 12px;
      }
      .escape-bar p:last-child {
        margin: 12px 0 0;
      }
      /* A secondary button (paper, line border): the app's own controls stay the loudest thing on the page. */
      .escape-bar button {
        min-height: 56px;
        padding: 0 20px;
        border: 2px solid #dfe6d6;
        border-radius: 12px;
        background: #fdfefb;
        color: #18221e;
        font: 700 17px 'Pretendard Variable', Pretendard, sans-serif;
        cursor: pointer;
      }
      .escape-bar .escape-close {
        position: absolute;
        top: max(4px, env(safe-area-inset-top));
        right: max(4px, env(safe-area-inset-right));
        width: 48px;
        min-height: 48px;
        padding: 0;
        border: 0;
        background: none;
        display: grid;
        place-items: center;
        color: #5b6b62;
      }
      .escape-bar[hidden] {
        display: none;
      }
      .escape-bar button:focus-visible {
        outline: 4px solid #18221e;
        outline-offset: 4px;
      }
      .escape-bar .url {
        user-select: all;
        -webkit-user-select: all;
        overflow-wrap: anywhere;
      }
    </style>
    <script>
      // In-app browsers (KakaoTalk, Instagram, Naver, Band …) play the videos but cannot install the app to the home
      // screen. Nothing moves by itself (2026-10-19, like video-cards): a bar at the top offers the real browser, and
      // the page works as usual below it. Runs before the app module:
      // - Android: [Chrome으로 열기] → Chrome intent, with S.browser_fallback_url when Chrome is missing.
      // - iOS KakaoTalk: [Safari로 열기] → KakaoTalk's external-open scheme (widely used, not officially documented).
      // - iOS other apps: no way out by script; [주소 복사] for Safari, plus the app's own menu path.
      // A tap counts inapp_escape.<app>. The count address and the opt-out key equal src/analytics.ts
      // (tests/inapp.test.ts); the app counts the visit itself as visit.<ref>.webview (__moabomInApp).
      (function () {
        var COUNT_URL = 'https://moabom.goatcounter.com/count';
        var OPT_OUT_KEY = 'moabom:v1:device:analytics';
        var APPS = [
          [/KAKAOTALK/i, 'kakao', '카카오톡'],
          [/Instagram/, 'insta', '인스타그램'],
          [/Barcelona|Threads/, 'threads', '스레드'],
          [/NAVER/, 'naver', '네이버'],
          [/BAND\//, 'band', '밴드'],
          [/FBAN|FBAV/, 'facebook', '페이스북'],
          [/DaumApps/, 'daum', '다음'],
          [/Line\//, 'line', '라인'],
          [/everytimeApp/i, 'everytime', '에브리타임'],
        ];
        var ua = navigator.userAgent;
        var app = null;
        for (var i = 0; i < APPS.length; i++) {
          if (APPS[i][0].test(ua)) {
            app = APPS[i];
            break;
          }
        }
        if (!app) return;
        window.__moabomInApp = app[1];

        var android = /Android/i.test(ua);
        var url = location.origin + location.pathname + location.search; // the hash would break the intent
        var target = null;
        var label = '';
        if (android) {
          target =
            'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
          label = 'Chrome으로 열기';
        } else if (app[1] === 'kakao') {
          target = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
          label = 'Safari로 열기';
        }

        var count = function () {
          try {
            if (localStorage.getItem(OPT_OUT_KEY) === '"off"') return;
          } catch (e) {}
          new Image().src = COUNT_URL + '?p=' + encodeURIComponent('inapp_escape.' + app[1]) + '&e=true&rnd=' + Math.floor(Math.random() * 1e9);
        };

        // Closed with ×: gone for this visit (the app also shows the bar only on home and the install guide).
        var CLOSED_KEY = 'moabom:v1:session:escapeClosed';
        try {
          if (sessionStorage.getItem(CLOSED_KEY) === '1') return;
        } catch (e) {}

        window.addEventListener('DOMContentLoaded', function () {
          var bar = document.createElement('div');
          bar.className = 'escape-bar';
          bar.setAttribute('role', 'region');
          bar.setAttribute('aria-label', '브라우저로 열기');
          if (target) {
            bar.innerHTML =
              '<p></p><button type="button" data-escape="open"></button>' +
              '<p>브라우저에서 열렸다면 이 창은 닫아도 돼요</p>';
            bar.querySelector('p').textContent = app[2] + ' 안에서는 홈 화면에 설치가 안 돼요. 브라우저에서 열면 앱처럼 설치할 수 있어요.';
            var open = bar.querySelector('[data-escape="open"]');
            open.textContent = label;
            open.addEventListener('click', function () {
              count();
              location.href = target;
            });
          } else {
            // iOS, not KakaoTalk (DR12): copy the address for Safari, or select it by hand when copying is blocked.
            var menu = app[1] === 'insta' || app[1] === 'threads' ? '오른쪽 위 ⋯ → 외부 브라우저에서 열기를 눌러도 돼요.' : '메뉴(⋯)에서 Safari로 열기를 찾아도 돼요.';
            bar.innerHTML =
              '<p></p><button type="button" data-escape="copy">주소 복사</button>' +
              '<p class="escape-msg" aria-live="polite"></p>';
            bar.querySelector('p').textContent = app[2] + ' 안에서는 홈 화면에 설치가 안 돼요. 주소를 복사해 Safari에 붙여 넣어 주세요. ' + menu;
            var msg = bar.querySelector('.escape-msg');
            var showUrl = function () {
              msg.textContent = '';
              var span = document.createElement('span');
              span.className = 'url';
              span.textContent = url;
              msg.appendChild(span);
            };
            bar.querySelector('[data-escape="copy"]').addEventListener('click', function () {
              count();
              try {
                navigator.clipboard.writeText(url).then(
                  function () {
                    msg.textContent = '복사했어요. Safari에 붙여 넣어 주세요';
                  },
                  showUrl,
                );
              } catch (e) {
                showUrl();
              }
            });
          }
          var close = document.createElement('button');
          close.type = 'button';
          close.className = 'escape-close';
          close.setAttribute('aria-label', '이 안내 닫기');
          // Lucide "x", the same close icon the app uses.
          close.innerHTML =
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
          close.addEventListener('click', function () {
            try {
              sessionStorage.setItem(CLOSED_KEY, '1');
            } catch (e) {}
            bar.remove();
          });
          bar.appendChild(close);
          // The app may have drawn its first screen already: same rule as render() (home and install guide only).
          if (/\/(c|settings|history|about)(\/|$)/.test(location.hash)) bar.hidden = true;
          document.body.prepend(bar);
        });
      })();
      // Android Chrome can fire this before the app module loads; keep it for the install guide's one-tap button.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('installprompt-ready'));
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
